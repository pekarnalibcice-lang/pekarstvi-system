<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekařství Ludvík & Mistrík - Systém řízení</title>
    <!-- Načtení Tailwind CSS frameworku pro rychlé a čisté stylování -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Hlavička systému -->
        <header class="border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black text-amber-400">🥖 Pekařství Ludvík & Mistrík s.r.o.</h1>
            <p class="text-xs text-slate-400 mt-1">Centrální systém řízení středisek a docházky</p>
        </header>

        <!-- Hlavní přehled kořenových uzlů stromu -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Uzel 1: Kralupy -->
            <div class="bg-slate-800 p-5 rounded-lg border border-slate-750 space-y-2">
                <div class="flex justify-between items-start">
                    <h2 class="text-base font-bold text-sky-400">🏢 Pekárna Kralupy</h2>
                    <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-[11px] rounded font-mono font-bold">ONLINE</span>
                </div>
                <p class="text-xs text-slate-400">Kořenový uzel: Výroba pečiva, Lahůdky, Cukrárna, Prodejna Centrum.</p>
            </div>

            <!-- Uzel 2: Libčice -->
            <div class="bg-slate-800 p-5 rounded-lg border border-slate-750 space-y-2">
                <div class="flex justify-between items-start">
                    <h2 class="text-base font-bold text-sky-400">🥟 Knedlíkárna Libčice</h2>
                    <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-[11px] rounded font-mono font-bold">ONLINE</span>
                </div>
                <p class="text-xs text-slate-400">Kořenový uzel: Výroba knedlíků a distribuce.</p>
            </div>

        </main>
    </div>
</body>
</html>
